# Production reads .env.production, never .env: run it through make (prod, build-prod, deploy…), which passes
# --env-file .env.production for the ${…} values below too.
#
# The code is mounted read-only: a compromised PHP process can't rewrite the app or plant files in it.
# Only storage/ and bootstrap/cache are writable. Deploys update the code from outside: git pull, and composer in a
# one-off container (.scripts/deploy.sh).
x-code-volumes: &code-volumes
  - ./:/var/www:ro
  - ./storage:/var/www/storage
  - ./bootstrap/cache:/var/www/bootstrap/cache

# No privilege escalation (setuid binaries, sudo) inside any container, and no Linux capabilities beyond what each
# service needs.
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  app:
    <<: *hardened
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: hrms_app
    container_name: hrms_app
    restart: always
    working_dir: /var/www
    volumes: *code-volumes
    # The php-fpm master starts as root to hand storage/ to www-data and run its workers as www-data
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - KILL
    networks:
      - hrms_app_network
    depends_on:
      - hrms_redis
    env_file:
      - .env.production
    command: php-fpm

  hrms_nginx:
    <<: *hardened
    image: nginx:alpine
    restart: always
    container_name: hrms_nginx
    ports:
      # Loopback only: the host nginx is the public entry point
      - "127.0.0.1:${APP_PORT:?Set APP_PORT in .env.production}:80"
    volumes:
      # nginx only serves public/; PHP requests go to php-fpm
      - ./public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - KILL
    depends_on:
      - app
    networks:
      - hrms_app_network

  hrms_redis:
    <<: *hardened
    image: redis:alpine
    restart: always
    container_name: hrms_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}"]
    cap_add:
      - SETUID
      - SETGID
    networks:
      - hrms_app_network

  hrms_reverb:
    <<: *hardened
    image: hrms_app  # same as app service
    restart: always
    container_name: hrms_reverb
    user: www-data
    working_dir: /var/www
    command: php artisan reverb:start
    volumes: *code-volumes
    depends_on:
      - app
    ports:
      # Loopback only: websockets are proxied by the host nginx
      - "127.0.0.1:6001:6001"
    networks:
      - hrms_app_network
    env_file:
      - .env.production

  hrms_queue:
    <<: *hardened
    image: hrms_app
    restart: always
    container_name: hrms_queue
    user: www-data
    working_dir: /var/www
    command: php artisan queue:work --tries=3 --timeout=90
    volumes: *code-volumes
    depends_on:
      - app
      - hrms_redis
    networks:
      - hrms_app_network
    env_file:
      - .env.production

  hrms_scheduler:
    <<: *hardened
    image: hrms_app
    restart: always
    container_name: hrms_scheduler
    user: www-data
    working_dir: /var/www
    command: php artisan schedule:work
    volumes: *code-volumes
    depends_on:
      - app
    networks:
      - hrms_app_network
    env_file:
      - .env.production

  hrms_gotenberg:
    <<: *hardened
    image: gotenberg/gotenberg:8
    restart: always
    container_name: hrms_gotenberg
    networks:
      - hrms_app_network

networks:
  hrms_app_network:
