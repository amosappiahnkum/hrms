# Security headers for the React app, served by the HOST nginx (not the container).
#
# Copy this file to the server (e.g. /etc/nginx/snippets/hrms-security-headers.conf) and include it ONLY in the
# location that serves the React build:
#
#     location / {
#         root /var/www/hrms-fe/dist;
#         try_files $uri /index.html;
#         include snippets/hrms-security-headers.conf;
#     }
#
# Don't include it in the proxied locations (/api, /sanctum, /broadcasting, ...): the container nginx already adds
# these to everything it answers, and nginx would send them twice.

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Camera (QR scan) and location (attendance) stay allowed for the app itself
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=()" always;

# Report-only to start: the browser console lists anything this would block (fonts, MinIO images, CDNs, ...)
# without blocking it. Adjust until the console is clean, then rename the header to Content-Security-Policy.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
