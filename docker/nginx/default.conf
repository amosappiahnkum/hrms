server {
        listen 80;
        server_name localhost hrms.cashpoint.com.gh;
        index index.php;
        root /var/www/public;
        server_tokens off;

        client_max_body_size 100M;

        location / {
            try_files $uri /index.php?$query_string;
        }

        # Only Laravel's front controller is executed; any other .php file under public/ is a 404
        location = /index.php {
            fastcgi_pass app:9000;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            include fastcgi_params;
            fastcgi_read_timeout 300;
        }

        location ~ \.php$ {
            return 404;
        }

        location ~ /\. {
            deny all;
        }
    }
